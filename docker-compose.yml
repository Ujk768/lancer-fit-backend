services:
  # PostgreSQL database. This is the only service we run in Docker for local dev.
  db:
    image: postgres:16
    container_name: lancer-fit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pwd}
      POSTGRES_DB: ${DB_NAME:-lancer-fit-db}
    ports:
      - "5432:5432"
    volumes:
      # NOTE the /data suffix — this is the correct Postgres data directory.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-user} -d ${DB_NAME:-lancer-fit-db}"]
      interval: 5s
      timeout: 5s
      retries: 5
  app:
    build:
      context: .
      target: development
    container_name: lancer-fit-app
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=development
      - DB_HOST=db  # This works inside Docker!
      - DB_USER=${DB_USER:-user}
      - DB_PASSWORD=${DB_PASSWORD:-pwd}
      - DB_NAME=${DB_NAME:-lancer-fit-db}
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        # Sync source code changes into the container instantly (no rebuild)
        - action: sync
          path: ./src
          target: /usr/src/app/src
        # Rebuild the image if package.json changes (new dependencies)
          ignore:
          - node_modules/
          - "*.log"
        - action: rebuild
          path: ./package.json
        # Rebuild if package-lock.json changes too
        - action: rebuild
          path: ./package-lock.json
volumes:
  pgdata: